[package]
name = "swanstation-ui"
version = "0.1.0"
edition = "2021"
description = "A small egui/libretro frontend for SwanStation"
license = "GPL-3.0-or-later"

[features]
default = []
bundled-sdl = ["sdl2/bundled"]

[dependencies]
anyhow = "1"
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
env_logger = "0.11"
libloading = "0.9"
log = "0.4"
serde = { version = "1", features = ["derive"] }
sdl2 = "0.38"
toml = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
