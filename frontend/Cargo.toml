[package]
name = "tsunderestation"
version = "0.3.1"
edition = "2021"
description = "A small egui/libretro frontend for the SwanStation core"
license = "GPL-3.0-or-later"

[features]
default = []
bundled-sdl = ["sdl2/bundled"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
encoding_rs = "0.8"
env_logger = "0.11"
glow = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.9"
log = "0.4"
minimp3 = "0.6"
png = "0.18"
serde = { version = "1", features = ["derive"] }
sdl2 = "0.38"
tempfile = "3"
toml = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
